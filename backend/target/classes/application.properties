# ===================================================================
# Rainwater Harvesting & Water Conservation Monitor Configuration
# Don Bosco Institute of Technology, Dept. of IT
# ===================================================================

server.port=8080

# ---------- Database (Standalone MySQL-compatible or MySQL 8) ----------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/rwh_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Security & JWT ----------
jwt.secret=CommunityProjectDonBoscoInstituteOfTechnologyRwhSecretKey2026Maharashtra
jwt.expirationMs=86400000

# ---------- OpenAPI / Swagger UI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------- Task Scheduling & Async ----------
spring.task.scheduling.pool.size=4
model.dir=models

# ---------- Multipart (CSV uploads) ----------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
