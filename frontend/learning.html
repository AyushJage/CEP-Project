<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="learning.title">ज्ञान व मार्गदर्शन - जलसाथी</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
</head>
<body>
    <header></header>

    <main class="container" style="margin-top: 2.25rem; margin-bottom: 4rem;">
        <div class="page-header">
            <div class="page-icon-badge">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </div>
            <h1 data-i18n="learning.title" style="margin-bottom:0.5rem; font-size:2.2rem;">शेतकरी ज्ञान व मार्गदर्शन केंद्र</h1>
            <p data-i18n="learning.subtitle" style="color:var(--color-text-secondary);max-width:820px;margin:0 auto;font-size:1.05rem;">
                शेततळे, जलकुंड, छतावरील पाणी संकलन आणि सेंद्रिय आच्छादनाबाबत सचित्र मार्गदर्शक पुस्तिका.
            </p>
        </div>

        <!-- Filter Buttons -->
        <div style="display:flex;justify-content:center;gap:0.75rem;flex-wrap:wrap;margin-bottom:2.5rem;">
            <button class="btn btn-primary filter-btn" data-cat="" data-i18n="learning.tab_all">सर्व मार्गदर्शक</button>
            <button class="btn btn-secondary filter-btn" data-cat="STRUCTURE" data-i18n="learning.tab_structure">रचना निर्मिती</button>
            <button class="btn btn-secondary filter-btn" data-cat="MAINTENANCE" data-i18n="learning.tab_maint">देखभाल</button>
            <button class="btn btn-secondary filter-btn" data-cat="SOIL" data-i18n="learning.tab_soil">माती व ओलावा</button>
        </div>

        <div id="guides-grid" class="grid grid-2" style="grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 1.75rem;">
            <!-- Dynamically loaded guides -->
        </div>
    </main>

    <footer></footer>

    <script type="module">
        import { api } from '/js/api.js';
        import { initNavbar } from '/js/navbar.js';
        import { getCurrentLanguage, t } from '/js/i18n.js';

        let currentCat = '';

        async function loadGuides(cat = '') {
            currentCat = cat;
            const url = cat ? `/learning?category=${cat}` : '/learning';
            try {
                const list = await api.get(url, false);
                const grid = document.getElementById('guides-grid');
                grid.innerHTML = '';
                const isMr = getCurrentLanguage() === 'mr';

                if (!list || list.length === 0) {
                    grid.innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;color:var(--color-text-muted);padding:3rem;">${t('learning.empty', 'या वर्गात अद्याप मार्गदर्शक उपलब्ध नाही.')}</div>`;
                    return;
                }

                list.forEach(g => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.display = 'flex';
                    card.style.flexDirection = 'column';
                    card.style.justifyContent = 'space-between';
                    card.style.marginBottom = '0';
                    card.style.padding = '2rem';

                    const title = (isMr ? g.titleMr : g.titleEn) || g.titleMr || g.titleEn;
                    const body = (isMr ? g.bodyMr : g.bodyEn) || g.bodyMr || g.bodyEn;
                    const suitLabel = t('learning.suitability', 'उपयुक्तता:');

                    card.innerHTML = `
                        <div>
                            <div class="card-header" style="align-items: flex-start; gap: 1rem; border-bottom: none; padding-bottom: 0.5rem; margin-bottom: 0.75rem;">
                                <h3 style="margin:0;font-size:1.3rem;color:var(--color-text);font-weight:700;line-height:1.35;">${title}</h3>
                                <span class="badge badge-info" style="font-size:0.8rem;letter-spacing:0.03em;text-transform:uppercase;">${g.category}</span>
                            </div>
                            <p style="font-size:1.02rem;line-height:1.75;color:var(--color-text-secondary);margin:0 0 1.5rem 0;">
                                ${body}
                            </p>
                        </div>
                        ${g.targetSituation ? `
                        <div style="font-size:0.9rem;color:var(--color-primary-dark);background:var(--color-primary-subtle);padding:0.75rem 1.1rem;border-radius:var(--radius-md);border:1px solid var(--color-primary-border);display:flex;align-items:center;gap:0.6rem;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="16" x2="12" y2="12"></line>
                                <line x1="12" y1="8" x2="12.01" y2="8"></line>
                            </svg>
                            <span><strong>${suitLabel}</strong> ${g.targetSituation}</span>
                        </div>` : ''}
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Failed to load guides:', err);
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.className = 'btn btn-secondary filter-btn');
                btn.className = 'btn btn-primary filter-btn';
                loadGuides(btn.dataset.cat);
            };
        });

        window.addEventListener('languageChange', () => loadGuides(currentCat));
        loadGuides();
    </script>
</body>
</html>
